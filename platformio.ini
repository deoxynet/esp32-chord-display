[platformio]
default_envs = core2

[env:core2]
platform = espressif32@7.0.1
board = m5stack-core2
framework = arduino
monitor_speed = 115200
lib_deps =
    m5stack/M5Unified@0.3.0
    m5stack/M5GFX@0.3.0
    h2zero/NimBLE-Arduino@2.5.2
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

[env:core2-demo]
extends = env:core2
build_flags = ${env:core2.build_flags} -DCHORD_DISPLAY_DEMO=1
